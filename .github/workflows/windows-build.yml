name: Build Windows Launcher

on:
  push:
    branches:
      - dimensionsro-optional-packs
      - master
  workflow_dispatch:

jobs:
  build:
    name: Build (i686-pc-windows-msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain (stable, i686)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Build release
        run: cargo build --release --target i686-pc-windows-msvc -p rpatchur

      - name: Upload Launcher.exe
        uses: actions/upload-artifact@v4
        with:
          name: Launcher-i686
          path: target/i686-pc-windows-msvc/release/rpatchur.exe
